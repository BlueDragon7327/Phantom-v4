<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>phantom</title>
<style>
  :root{
    --void: #0a0510;
    --void-2: #120a1f;
    --ink: #1a0f2e;
    --spirit: #a970ff;
    --spirit-dim: #7c4dd6;
    --spirit-bright: #d4b3ff;
    --mist: #efe7ff;
    --mist-dim: #8f7fb3;
    --line: rgba(169,112,255,0.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--void);
    color:var(--mist);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }

  /* ambient fog layer */
  #fog{
    position:fixed;inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 15%, rgba(124,77,214,0.18), transparent 60%),
      radial-gradient(ellipse 50% 50% at 85% 80%, rgba(169,112,255,0.14), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(60,20,90,0.25), transparent 70%);
    animation: drift 18s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes drift{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(-2%, 2%) scale(1.05); }
  }

  /* floating wisps */
  .wisp{
    position:fixed;
    border-radius:50%;
    background: radial-gradient(circle, rgba(169,112,255,0.5), transparent 70%);
    filter: blur(2px);
    pointer-events:none;
    z-index:1;
    opacity:0.5;
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.6; }
    90%{ opacity:0.3; }
    100%{ transform: translateY(-110vh) translateX(20px); opacity:0; }
  }

  /* ---------- MENU SCREEN ---------- */
  #menu{
    position:fixed;inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:56px;
    transition: opacity 0.6s ease, filter 0.6s ease;
  }
  #menu.hidden{
    opacity:0;
    filter: blur(12px);
    pointer-events:none;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    user-select:none;
  }
  .ghost-mark{
    width:64px;height:64px;
    opacity:0.9;
    filter: drop-shadow(0 0 18px rgba(169,112,255,0.65));
    animation: bob 4s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-10px); }
  }
  .brand h1{
    font-size: 42px;
    letter-spacing: 10px;
    font-weight: 600;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--spirit-bright), var(--spirit-dim));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 0 40px rgba(169,112,255,0.35);
  }
  .brand p{
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--mist-dim);
    text-transform: uppercase;
  }

  .choices{
    display:flex;
    gap:28px;
    flex-wrap: wrap;
    justify-content:center;
    padding: 0 20px;
  }
  .choice-card{
    width: 220px;
    padding: 32px 24px;
    background: linear-gradient(160deg, rgba(26,15,46,0.85), rgba(10,5,16,0.9));
    border: 1px solid var(--line);
    border-radius: 14px;
    cursor:pointer;
    text-align:center;
    position:relative;
    overflow:hidden;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .choice-card::before{
    content:'';
    position:absolute;
    inset:-2px;
    background: linear-gradient(135deg, var(--spirit), transparent 40%);
    opacity:0;
    transition: opacity 0.3s ease;
    z-index:-1;
    border-radius: 14px;
  }
  .choice-card:hover{
    transform: translateY(-6px);
    border-color: var(--spirit);
    box-shadow: 0 12px 40px rgba(124,77,214,0.35);
  }
  .choice-card:hover::before{ opacity:0.15; }
  .choice-card:active{ transform: translateY(-2px) scale(0.98); }

  .choice-icon{
    font-size: 30px;
    margin-bottom: 14px;
    filter: drop-shadow(0 0 10px rgba(169,112,255,0.5));
  }
  .choice-card h2{
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    color: var(--spirit-bright);
  }
  .choice-card p{
    font-size: 12.5px;
    color: var(--mist-dim);
    line-height: 1.5;
  }

  /* ---------- IFRAME LOADER APP ---------- */
  #app{
    position:fixed;inset:0;
    z-index:10;
    display:none;
    flex-direction:column;
    background: var(--void);
    opacity:0;
    transition: opacity 0.5s ease;
  }
  #app.active{ display:flex; }
  #app.show{ opacity:1; }

  #tabbar{
    display:flex;
    align-items:center;
    background: linear-gradient(180deg, var(--ink), var(--void-2));
    border-bottom: 1px solid var(--line);
    padding: 8px 8px 0 8px;
    gap:6px;
    -webkit-app-region:drag;
    flex-shrink:0;
  }
  #tabs{
    display:flex;
    gap:4px;
    flex:1;
    overflow-x:auto;
    scrollbar-width:none;
  }
  #tabs::-webkit-scrollbar{ display:none; }

  .tab{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:130px;
    max-width:180px;
    padding: 9px 12px;
    background: rgba(169,112,255,0.06);
    border: 1px solid transparent;
    border-bottom:none;
    border-radius: 8px 8px 0 0;
    font-size:12.5px;
    color: var(--mist-dim);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .tab:hover{ background: rgba(169,112,255,0.12); }
  .tab.active{
    background: var(--void);
    color: var(--spirit-bright);
    border-color: var(--line);
    box-shadow: 0 -2px 12px rgba(124,77,214,0.15);
  }
  .tab .tab-title{ flex:1; overflow:hidden; text-overflow:ellipsis; }
  .tab .tab-close{
    opacity:0.5;
    font-size:14px;
    line-height:1;
    padding:2px 4px;
    border-radius:4px;
  }
  .tab .tab-close:hover{ opacity:1; background: rgba(255,255,255,0.1); }

  .icon-btn{
    -webkit-app-region:no-drag;
    background:none;
    border:none;
    color: var(--mist-dim);
    width:32px;height:32px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
    transition: background 0.2s ease, color 0.2s ease;
    flex-shrink:0;
  }
  .icon-btn:hover{ background: rgba(169,112,255,0.15); color: var(--spirit-bright); }

  #toolbar{
    -webkit-app-region:no-drag;
    display:flex;
    align-items:center;
    gap:8px;
    padding: 8px 10px;
    background: var(--void-2);
    border-bottom: 1px solid var(--line);
    flex-shrink:0;
  }
  #urlbar{
    flex:1;
    background: rgba(169,112,255,0.06);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 8px 16px;
    color: var(--mist);
    font-size: 13px;
    outline:none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  #urlbar:focus{
    border-color: var(--spirit);
    background: rgba(169,112,255,0.1);
  }
  #urlbar::placeholder{ color: var(--mist-dim); }

  #frame-container{
    flex:1;
    position:relative;
    background: var(--void);
  }
  .frame-slot{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:none;
    display:none;
    background: #050308;
  }
  .frame-slot.active{ display:block; }

  #empty-state{
    position:absolute; inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    color: var(--mist-dim);
    pointer-events:none;
  }
  #empty-state .ghost-mark{ width:48px;height:48px; opacity:0.4; }
  #empty-state p{ font-size:13px; letter-spacing:1px; }

  /* back button top-left when in browser mode */
  #back-btn{
    position:fixed;
    top:14px; left:14px;
    z-index:20;
    background: rgba(10,5,16,0.7);
    border:1px solid var(--line);
    color: var(--spirit-bright);
    padding: 8px 14px;
    border-radius: 20px;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    backdrop-filter: blur(8px);
    display:none;
    align-items:center;
    gap:6px;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  #back-btn:hover{ background: rgba(124,77,214,0.3); transform: translateX(-2px); }
  #back-btn.show{ display:flex; }

  #browser-frame{
    position:fixed; inset:0;
    width:100%; height:100%;
    border:none;
    z-index:8;
    display:none;
    background:#050308;
  }
  #browser-frame.active{ display:block; }

  @media (max-width: 560px){
    .choices{ flex-direction:column; align-items:center; }
    .brand h1{ font-size:32px; letter-spacing:6px; }
  }
</style>
</head>
<body>

<div id="fog"></div>
<div id="wisp-container"></div>

<!-- MENU -->
<div id="menu">
  <div class="brand">
    <svg class="ghost-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 8C29 8 14 24 14 46V88L26 78L38 88L50 78L62 88L74 78L86 88V46C86 24 71 8 50 8Z" fill="url(#g)"/>
      <circle cx="38" cy="46" r="5" fill="#0a0510"/>
      <circle cx="62" cy="46" r="5" fill="#0a0510"/>
      <defs>
        <linearGradient id="g" x1="14" y1="8" x2="86" y2="88" gradientUnits="userSpaceOnUse">
          <stop stop-color="#d4b3ff"/>
          <stop offset="1" stop-color="#7c4dd6"/>
        </linearGradient>
      </defs>
    </svg>
    <h1>phantom</h1>
    <p>choose your vessel</p>
  </div>

  <div class="choices">
    <div class="choice-card" id="choose-iframe">
      <div class="choice-icon">◆</div>
      <h2>iframe</h2>
      <p>a tabbed loader — punch in any url, open multiple tabs, go fullscreen.</p>
    </div>
    <div class="choice-card" id="choose-browser">
      <div class="choice-icon">◈</div>
      <h2>browser</h2>
      <p>drops you straight into browser.lol, full page, no chrome.</p>
    </div>
  </div>
</div>

<!-- BROWSER.LOL FULL PAGE MODE -->
<button id="back-btn"><span>‹</span> back</button>
<iframe id="browser-frame" src="about:blank"></iframe>

<!-- IFRAME LOADER APP -->
<div id="app">
  <div id="tabbar">
    <div id="tabs"></div>
    <button class="icon-btn" id="new-tab-btn" title="new tab">＋</button>
    <button class="icon-btn" id="fullscreen-btn" title="fullscreen">⛶</button>
    <button class="icon-btn" id="home-btn" title="back to menu">⟲</button>
  </div>
  <div id="toolbar">
    <button class="icon-btn" id="reload-btn" title="reload">↻</button>
    <input id="urlbar" type="text" placeholder="type a url and hit enter…  e.g. wikipedia.org" autocomplete="off" spellcheck="false">
    <button class="icon-btn" id="go-btn" title="go">→</button>
  </div>
  <div id="frame-container">
    <div id="empty-state">
      <svg class="ghost-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 8C29 8 14 24 14 46V88L26 78L38 88L50 78L62 88L74 78L86 88V46C86 24 71 8 50 8Z" fill="url(#g2)"/>
        <circle cx="38" cy="46" r="5" fill="#0a0510"/>
        <circle cx="62" cy="46" r="5" fill="#0a0510"/>
        <defs>
          <linearGradient id="g2" x1="14" y1="8" x2="86" y2="88" gradientUnits="userSpaceOnUse">
            <stop stop-color="#d4b3ff"/>
            <stop offset="1" stop-color="#7c4dd6"/>
          </linearGradient>
        </defs>
      </svg>
      <p>no tabs open — hit ＋ to summon one</p>
    </div>
  </div>
</div>

<script>
// ---------- ambient wisps ----------
const wispContainer = document.getElementById('wisp-container');
for(let i=0;i<14;i++){
  const w = document.createElement('div');
  w.className='wisp';
  const size = 4 + Math.random()*10;
  w.style.width = size+'px';
  w.style.height = size+'px';
  w.style.left = Math.random()*100+'vw';
  w.style.bottom = '-20px';
  w.style.animationDuration = (12 + Math.random()*14)+'s';
  w.style.animationDelay = (Math.random()*14)+'s';
  wispContainer.appendChild(w);
}

// ---------- menu logic ----------
const menu = document.getElementById('menu');
const app = document.getElementById('app');
const browserFrame = document.getElementById('browser-frame');
const backBtn = document.getElementById('back-btn');

document.getElementById('choose-iframe').addEventListener('click', () => {
  menu.classList.add('hidden');
  setTimeout(()=>{
    app.classList.add('active');
    requestAnimationFrame(()=> app.classList.add('show'));
    newTab(); // start with one empty tab
  }, 400);
});

document.getElementById('choose-browser').addEventListener('click', () => {
  menu.classList.add('hidden');
  browserFrame.src = 'https://browser.lol';
  browserFrame.classList.add('active');
  backBtn.classList.add('show');
});

backBtn.addEventListener('click', () => {
  browserFrame.classList.remove('active');
  browserFrame.src = 'about:blank';
  backBtn.classList.remove('show');
  menu.classList.remove('hidden');
});

// ---------- iframe loader app logic ----------
const tabsEl = document.getElementById('tabs');
const frameContainer = document.getElementById('frame-container');
const emptyState = document.getElementById('empty-state');
const urlbar = document.getElementById('urlbar');

let tabs = [];
let activeTabId = null;
let tabCounter = 0;

function normalizeUrl(input){
  input = input.trim();
  if(!input) return null;
  if(/^https?:\/\//i.test(input)) return input;
  if(/^[\w-]+(\.[\w-]+)+.*$/.test(input) && !input.includes(' ')) return 'https://' + input;
  return 'https://www.google.com/search?q=' + encodeURIComponent(input);
}

function newTab(url){
  tabCounter++;
  const id = 'tab-' + tabCounter;
  const tab = { id, url: url || null, title: url ? url.replace(/^https?:\/\//,'').split('/')[0] : 'new tab' };
  tabs.push(tab);

  const tabEl = document.createElement('div');
  tabEl.className = 'tab';
  tabEl.dataset.id = id;
  tabEl.innerHTML = `<span class="tab-title">${tab.title}</span><span class="tab-close">×</span>`;
  tabEl.addEventListener('click', (e) => {
    if(e.target.classList.contains('tab-close')){
      closeTab(id);
      e.stopPropagation();
      return;
    }
    activateTab(id);
  });
  tabsEl.appendChild(tabEl);

  const frame = document.createElement('iframe');
  frame.className = 'frame-slot';
  frame.dataset.id = id;
  if(url) frame.src = url;
  frameContainer.appendChild(frame);

  activateTab(id);
  return id;
}

function activateTab(id){
  activeTabId = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
  document.querySelectorAll('.frame-slot').forEach(f => f.classList.toggle('active', f.dataset.id === id));
  const tab = tabs.find(t => t.id === id);
  urlbar.value = tab && tab.url ? tab.url : '';
  emptyState.style.display = tab && tab.url ? 'none' : (tabs.length ? 'none' : 'flex');
  if(tabs.length === 0) emptyState.style.display = 'flex';
}

function closeTab(id){
  const idx = tabs.findIndex(t => t.id === id);
  if(idx === -1) return;
  tabs.splice(idx,1);
  document.querySelector(`.tab[data-id="${id}"]`)?.remove();
  document.querySelector(`.frame-slot[data-id="${id}"]`)?.remove();

  if(activeTabId === id){
    if(tabs.length){
      activateTab(tabs[Math.max(0, idx-1)].id);
    } else {
      activeTabId = null;
      urlbar.value = '';
      emptyState.style.display = 'flex';
    }
  }
}

function loadUrlInActiveTab(rawInput){
  const url = normalizeUrl(rawInput);
  if(!url) return;
  if(!activeTabId){
    newTab(url);
    return;
  }
  const tab = tabs.find(t => t.id === activeTabId);
  tab.url = url;
  tab.title = url.replace(/^https?:\/\//,'').split('/')[0];
  const tabEl = document.querySelector(`.tab[data-id="${activeTabId}"] .tab-title`);
  if(tabEl) tabEl.textContent = tab.title;
  const frame = document.querySelector(`.frame-slot[data-id="${activeTabId}"]`);
  if(frame) frame.src = url;
  emptyState.style.display = 'none';
}

document.getElementById('new-tab-btn').addEventListener('click', () => newTab());
document.getElementById('go-btn').addEventListener('click', () => loadUrlInActiveTab(urlbar.value));
urlbar.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') loadUrlInActiveTab(urlbar.value);
});
document.getElementById('reload-btn').addEventListener('click', () => {
  if(!activeTabId) return;
  const frame = document.querySelector(`.frame-slot[data-id="${activeTabId}"]`);
  if(frame && frame.src && frame.src !== 'about:blank'){
    frame.src = frame.src;
  }
});
document.getElementById('fullscreen-btn').addEventListener('click', () => {
  if(!document.fullscreenElement){
    app.requestFullscreen?.().catch(()=>{});
  } else {
    document.exitFullscreen?.();
  }
});
document.getElementById('home-btn').addEventListener('click', () => {
  app.classList.remove('show');
  setTimeout(()=>{
    app.classList.remove('active');
    menu.classList.remove('hidden');
  }, 400);
});
</script>

</body>
</html>
